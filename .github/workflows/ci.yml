name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_FF_DEMO_DATA: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:unit
        env:
          FIXLY_JOBS_STORE: memory
          FIXLY_WEBHOOK_DRY_RUN: '1'
      - run: npm run smoke:phase1
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke
        run: npm run test:e2e
        env:
          CI: 'true'

  health:
    runs-on: ubuntu-latest
    needs: build
    if: vars.HEALTH_CHECK_URL != ''
    steps:
      - name: Production health check
        run: |
          curl -sf "${{ vars.HEALTH_CHECK_URL }}/api/health" | tee health.json
          grep -q '"mode":"supabase"' health.json || (echo "Expected supabase mode" && exit 1)

  mobile:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run mobile:check
