name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  health:
    runs-on: ubuntu-latest
    needs: build
    if: vars.HEALTH_CHECK_URL != ''
    steps:
      - name: Production health check
        run: |
          curl -sf "${{ vars.HEALTH_CHECK_URL }}/api/health" | tee health.json
          grep -q '"mode":"supabase"' health.json || (echo "Expected supabase mode" && exit 1)
